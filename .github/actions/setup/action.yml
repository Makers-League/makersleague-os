name: Setup
description: Node, pnpm, Bun and dependencies
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v5
      with:
        node-version: 22
        cache: pnpm
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: .bun-version
    - run: pnpm install --frozen-lockfile
      shell: bash
