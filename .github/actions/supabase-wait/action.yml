name: Wait for Supabase
description: Waits for ./.github/actions/supabase-start, fails with its log if it failed, and writes .env.local.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        for _ in $(seq 180); do [ -f "$RUNNER_TEMP/supabase.exit" ] && break; sleep 1; done
        cat "$RUNNER_TEMP/supabase.log"
        if [ ! -f "$RUNNER_TEMP/supabase.exit" ]; then
          echo "::error::Supabase did not start within 3 minutes."
          exit 1
        fi
        code=$(cat "$RUNNER_TEMP/supabase.exit")
        [ "$code" = 0 ] || exit "$code"
        bun run env:local
