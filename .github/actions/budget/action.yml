name: Time budget
description: Fails the job when it ran longer than its budget (counted from the setup action).
inputs:
  seconds:
    description: Budget in seconds
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        took=$(( $(date +%s) - JOB_START ))
        echo "Took ${took}s, budget ${{ inputs.seconds }}s" | tee -a "$GITHUB_STEP_SUMMARY"
        if [ "$took" -gt "${{ inputs.seconds }}" ]; then
          echo "::error::Over budget: ${took}s > ${{ inputs.seconds }}s. Find what got slower."
          exit 1
        fi
