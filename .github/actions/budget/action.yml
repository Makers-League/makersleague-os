name: Time budget
description: Fails the job when it ran longer than its budget (counted from the job's start).
inputs:
  seconds:
    description: Budget in seconds
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        # The runner's worker process starts with the job, so its age is the job's run time.
        took=$(ps -o etimes= -C Runner.Worker | sort -n | tail -1 | tr -d ' ')
        if [ -z "$took" ]; then
          echo "::error::Runner.Worker not found, cannot measure the job's time."
          exit 1
        fi
        echo "Took ${took}s, budget ${{ inputs.seconds }}s" | tee -a "$GITHUB_STEP_SUMMARY"
        if [ "$took" -gt "${{ inputs.seconds }}" ]; then
          echo "::error::Over budget: ${took}s > ${{ inputs.seconds }}s. Find what got slower."
          exit 1
        fi
