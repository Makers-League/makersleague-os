name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

# A new commit cancels the branch's run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Blobless clone with history: --changed needs the merge base, blobs load on demand.
# No job waits on another. Each job fails when it runs over its time budget.
jobs:
  checks:
    name: format, lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          filter: blob:none
          fetch-depth: 0
      - uses: ./.github/actions/setup
      # On pull requests, unit tests run only what the diff can reach (scripts/unit-tests.sh).
      # Pushes to main and the merge queue run everything.
      - name: Merge base
        if: github.event_name == 'pull_request'
        run: echo "BASE=$(git merge-base origin/${{ github.base_ref }} HEAD)" >> "$GITHUB_ENV"
      - run: bash scripts/ci-checks.sh
        env:
          # The build only needs well-formed values; nothing is called at build time.
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder
      - uses: ./.github/actions/budget
        with:
          seconds: 35

  database:
    name: migrations + RLS tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          filter: blob:none
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/supabase
      - name: Generated types match the migrations
        run: |
          bun run db:types
          git diff --exit-code packages/db/src/database.types.ts
      # The stack was just built from scratch, so no reset is needed here.
      - name: RLS tests (pgTAP)
        run: bunx supabase test db
      - uses: ./.github/actions/budget
        with:
          seconds: 45

  sync:
    name: sync integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          filter: blob:none
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/supabase
      - run: bun run test:integration
      - uses: ./.github/actions/budget
        with:
          seconds: 45

  e2e:
    name: e2e tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          filter: blob:none
      - uses: ./.github/actions/setup
      # Supabase pulls its images while the browser installs.
      - name: Start Supabase in the background
        run: (bun run db:start > "$RUNNER_TEMP/supabase.log" 2>&1; echo $? > "$RUNNER_TEMP/supabase.exit") &
      - uses: actions/cache@v4
        id: playwright
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      # The runner image has Chromium's system libraries; only the browser build is needed.
      - name: Install Playwright browser
        if: steps.playwright.outputs.cache-hit != 'true'
        working-directory: apps/web
        run: bunx playwright install chromium
      - name: Wait for Supabase
        run: |
          until [ -f "$RUNNER_TEMP/supabase.exit" ]; do sleep 1; done
          cat "$RUNNER_TEMP/supabase.log"
          exit "$(cat "$RUNNER_TEMP/supabase.exit")"
      - run: bun run env:local
      - name: Build app
        run: bunx turbo run build --filter=@ml/web
      - run: bun run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
      - uses: ./.github/actions/budget
        with:
          seconds: 60
