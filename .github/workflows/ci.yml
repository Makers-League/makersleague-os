name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Format, lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint --deny-warnings
      - run: pnpm typecheck
      - run: pnpm test
      # The build only needs well-formed values; nothing is called at build time.
      - run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder

  database:
    name: Migrations, RLS tests, sync and e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Start local Supabase (applies all migrations + seed from scratch)
        run: pnpm exec supabase start -x studio,imgproxy,vector,logflare,edge-runtime,realtime,storage-api,supavisor

      - name: Write .env.local from the local stack
        run: pnpm env:local

      - name: Generated types match the migrations
        run: |
          pnpm db:types
          git diff --exit-code packages/db/src/database.types.ts

      # The stack was just built from scratch, so no reset is needed here.
      - name: RLS tests (pgTAP)
        run: pnpm exec supabase test db

      - name: Sync integration tests
        run: pnpm --filter @ml/easyverein test:integration

      - name: Install Playwright browser
        run: pnpm --filter @ml/web exec playwright install --with-deps chromium

      - name: Build app for e2e
        run: pnpm turbo run build --filter=@ml/web

      - name: End-to-end tests
        run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
